name: qwen38-vllm

services:
  qwen:
    # Upstream CUDA 13.0, linux/amd64. No Inkling Python/kernel overrides.
    image: vllm/vllm-openai:v0.34.0@sha256:cf5b2fdd087eb4f6d261736967cc5cde974bd22ff4df50365f8fa419b6b4c484
    init: true
    ipc: host
    devices:
      - "nvidia.com/gpu=${QWEN_GPU_0:-1}"
      - "nvidia.com/gpu=${QWEN_GPU_1:-2}"
    ports:
      - "127.0.0.1:${QWEN_HOST_PORT:-6003}:8000"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NCCL_P2P_LEVEL: NVL
      NCCL_IB_DISABLE: "1"
      # Keep normal NCCL on the stock build; set to 1 only to test the
      # PyTorch NCCL fallback used by the Inkling image.
      VLLM_DISABLE_PYNCCL: "${QWEN_DISABLE_PYNCCL:-0}"
      HF_HUB_OFFLINE: "1"
    volumes:
      # Snapshot files are relative symlinks to blobs; mount the whole model cache.
      - type: bind
        source: "${QWEN_MODEL_CACHE:-${HOME}/.cache/huggingface/hub/models--palmfuture--Qwen3.8-27B-GPTQ-Int4}"
        target: /checkpoint
        read_only: true
        bind:
          create_host_path: false
      - kernel-cache:/root/.cache
    command:
      - "/checkpoint/snapshots/${QWEN_MODEL_REVISION:-d85a556c59b2959d083d685a8d1db100f4aeb88d}"
      - --served-model-name
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --disable-custom-all-reduce
      # AutoGPTQ reads the checkpoint metadata and selects the kernel.
      - --dtype
      - bfloat16
      - --max-model-len
      - "${QWEN_MAX_MODEL_LEN:-65536}"
      - --gpu-memory-utilization
      - "${QWEN_GPU_MEMORY_UTILIZATION:-0.93}"
      - "${QWEN_VISION_FLAG:---language-model-only}"
      - --limit-mm-per-prompt
      - '{"image":1,"video":0}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --attention-backend
      - "${QWEN_ATTENTION_BACKEND:-FLASH_ATTN}"
      - --kv-cache-dtype
      - "${QWEN_KV_CACHE_DTYPE:-auto}"
      - --gdn-prefill-backend
      - triton
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "${QWEN_PREFILL_CHUNK:-1024}"
      - --max-num-seqs
      - "2"
      # Eager prefill; capture one or two decode requests. Eight tokens also
      # covers verification at MTP K=3: 2 * (1 + 3).
      - --compilation-config
      - '{"mode":0,"cudagraph_mode":"${QWEN_GRAPH_MODE:-FULL_DECODE_ONLY}","prefill_cudagraph_capture_token_sizes":[],"decode_cudagraph_capture_request_sizes":[1,2],"max_decode_cudagraph_capture_tokens":8}'

volumes:
  kernel-cache:
