services:
  inkling:
    image: local/inkling2-mini-ampere:sm86
    build: .
    init: true
    ipc: host
    devices:
      - "nvidia.com/gpu=${GPU_DEVICE_0:-0}"
      - "nvidia.com/gpu=${GPU_DEVICE_1:-1}"
    ports:
      - "127.0.0.1:${HOST_PORT:-6002}:8000"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NCCL_P2P_LEVEL: NVL
      NCCL_IB_DISABLE: "1"
      INKLING_SM80: "1"
      INKLING_SM80_INT8_KV: "1"
      INKLING_SM86_INT8_PREFILL: "${INKLING_SM86_INT8_PREFILL:-0}"
      INKLING_SM80_HUMMING: '{"block_shape":[8,128,128],"warp_shape":[8,64,64],"num_stages":2,"num_ctas_per_sm":1}'
      VLLM_KV_CACHE_LAYOUT: BLHNC
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
      TRITON_CACHE_DIR: /root/.cache/triton
      HF_HUB_OFFLINE: "1"
      TORCH_COMPILE_DISABLE: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      VLLM_DISABLE_PYNCCL: "1"
    volumes:
      - type: bind
        source: ${MODEL_DIR:?Set MODEL_DIR in .env}
        target: /model
        read_only: true
        bind:
          create_host_path: false
      - kernel-cache:/root/.cache
    command:
      - /model
      - --served-model-name
      - inkling-2-mini
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "2"
      - --disable-custom-all-reduce
      - --max-model-len
      - "${MAX_MODEL_LEN:-200000}"
      - "${ASYNC_FLAG:---no-async-scheduling}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.93}"
      - --no-language-model-only
      - --limit-mm-per-prompt
      - '{"image":1,"video":0}'
      - --reasoning-parser
      - inkling
      - --enable-auto-tool-choice
      - --tool-call-parser
      - inkling
      - --max-num-batched-tokens
      - "${PREFILL_CHUNK:-2048}"
      - --max-num-seqs
      - "2"
      - --compilation-config
      - '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY","prefill_cudagraph_capture_token_sizes":[],"decode_cudagraph_capture_request_sizes":[1,2],"max_decode_cudagraph_capture_tokens":${DECODE_GRAPH_TOKENS:-10}}'
      - --kernel-config
      - '{"enable_jit_warmup":false,"ir_op_priority":{"rms_norm":["native"],"fused_add_rms_norm":["native"]}}'

volumes:
  kernel-cache:
